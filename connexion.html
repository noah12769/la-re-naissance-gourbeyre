<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Connexion — La Re-Naissance</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<link href="assets/images/favicon-32.webp" rel="icon" type="image/webp"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="assets/admin/admin.css" rel="stylesheet"/>
</head>
<body class="login-body">
<main class="login-card">
  <h1>Connexion</h1>
  <p>Espace réservé à la gestion des photos du site.</p>
  <form id="login-form" novalidate>
    <label class="field" for="password">Mot de passe
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus/>
    </label>
    <p class="form-error" id="login-error" role="alert" hidden>Mot de passe incorrect.</p>
    <button class="btn btn-primary" type="submit" style="margin-top:1rem;width:100%">Se connecter</button>
  </form>
  <button class="btn-link btn" type="button" id="forgot-link" style="margin-top:0.25rem">Mot de passe oublié ?</button>
  <p class="hint" id="forgot-status" role="status" hidden></p>
  <div class="login-back">
    <a class="btn" href="index.html">← Retour au site</a>
    <small>Pas besoin de vous connecter pour visiter le site.</small>
  </div>
</main>
<script src="assets/js/supabase.min.js"></script>
<script src="assets/admin/supabase-config.js"></script>
<script>
/* Real login via Supabase Auth. There is a single admin account for the whole site (one
   shared password, as asked), so the email itself isn't something the person needs to
   remember or type -- it's fixed here and only the password comes from the form. Change
   ADMIN_EMAIL if the admin account in Supabase (Authentication > Users) ever changes. */
(function () {
  var ADMIN_EMAIL = 'la.re.naissance97113@gmail.com';
  var client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var form = document.getElementById('login-form');
  var input = document.getElementById('password');
  var error = document.getElementById('login-error');
  var submitBtn = form.querySelector('button[type="submit"]');

  // Already signed in from an earlier visit (Supabase keeps the session in localStorage)?
  client.auth.getSession().then(function (res) {
    if (res.data.session) location.replace('admin.html');
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Connexion…';
    client.auth.signInWithPassword({ email: ADMIN_EMAIL, password: input.value }).then(function (res) {
      if (res.error) throw res.error;
      location.href = 'admin.html';
    }).catch(function () {
      // Generic message on purpose: whether the password is wrong or the network failed,
      // there is nothing actionable to tell apart here for a single shared password.
      error.hidden = false;
      input.value = '';
      input.focus();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Se connecter';
    });
  });
  input.addEventListener('input', function () { error.hidden = true; });

  // "Mot de passe oublié" -- the admin email is fixed (ADMIN_EMAIL above), so there's
  // nothing to type: one click asks Supabase to send a reset link to that address.
  // Supabase itself rate-limits this (one email per address per short window), so a
  // second click right after the first is expected to silently do nothing new.
  var forgotLink = document.getElementById('forgot-link');
  var forgotStatus = document.getElementById('forgot-status');
  forgotLink.addEventListener('click', function () {
    forgotLink.disabled = true;
    client.auth.resetPasswordForEmail(ADMIN_EMAIL, {
      redirectTo: location.origin + '/reinitialiser-mot-de-passe.html'
    }).then(function (res) {
      forgotStatus.hidden = false;
      forgotStatus.textContent = res.error
        ? "L'envoi a échoué. Réessayez dans une minute."
        : "Un lien de réinitialisation a été envoyé à l'adresse admin enregistrée.";
    });
  });
})();
</script>
</body>
</html>
